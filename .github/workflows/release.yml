name: Release

# Push a tag like v0.5.6 (version must match package.json) to build Windows, macOS and Linux
# installers and attach them to the GitHub release. "Run workflow" builds without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: 'dist/TwoEasy-Setup-*.exe'
          - os: macos-latest
            script: dist:mac
            files: 'dist/*.dmg'
          - os: ubuntu-latest
            script: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: twoeasy-${{ matrix.os }}
          path: ${{ matrix.files }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
